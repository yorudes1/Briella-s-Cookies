<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Briella's Cookies</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet">

  <style>
    /* --- Premium Cookie Shop Palette --- */
    :root {
      --brown-dark: #3C2F2F;      /* Deep dark espresso espresso */
      --brown-warm: #8C6239;      /* Smooth milk chocolate accent */
      --brown-light: #A8927A;     /* Muted taupe/biscuit */
      --brown-cream: #F7F3EC;     /* Warm ivory panel background */
      --white-luxury: #FDFBF7;    /* Crisp elite soft-white background */
      --border-soft: #EFEBE4;     /* Elegant dividing line cream */
      
      --font-serif: 'Playfair Display', serif;
      --font-display: 'Cormorant Garamond', serif;
      --font-sans: 'Jost', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--white-luxury);
      font-family: var(--font-sans);
      color: var(--brown-dark);
      -webkit-font-smoothing: antialiased;
    }

    .auth-wrapper {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 1fr 1.2fr;
    }

    /* --- Left Panel: Editorial Showcase --- */
    .auth-hero {
      background: var(--brown-cream);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 5rem 4rem;
      position: relative;
      border-right: 1px solid var(--border-soft);
    }

    /* Elegant fine-line accent border inside the hero panel */
    .auth-hero::after {
      content: '';
      position: absolute;
      inset: 24px;
      border: 1px solid rgba(140, 98, 57, 0.15);
      pointer-events: none;
    }

    .auth-hero-content {
      position: relative;
      margin-top: auto;
      margin-bottom: auto;
      max-width: 400px;
    }

    .hero-title {
      font-family: var(--font-serif);
      font-size: 3.5rem;
      font-weight: 400;
      color: var(--brown-dark);
      line-height: 1.1;
      letter-spacing: -1px;
    }

    .hero-title em {
      color: var(--brown-warm);
      font-style: italic;
      font-family: var(--font-serif);
    }

    .hero-tagline {
      font-family: var(--font-display);
      font-size: 1.2rem;
      font-style: italic;
      color: var(--brown-light);
      margin-top: 1.2rem;
      letter-spacing: 0.05em;
    }

    .hero-divider {
      width: 40px;
      height: 1px;
      background: var(--brown-warm);
      margin: 2rem 0;
      opacity: 0.6;
    }

    .hero-quote {
      font-family: var(--font-display);
      font-size: 1.05rem;
      color: var(--brown-dark);
      opacity: 0.75;
      font-style: italic;
      line-height: 1.6;
    }

    /* Bottom footer credentials container */
    .hero-footer-signature {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--brown-light);
      display: flex;
      gap: 12px;
      align-items: center;
      z-index: 2;
    }

    .hero-footer-signature .dot {
      color: var(--brown-warm);
    }

    /* --- Right Panel: Minimalist Input Form --- */
    .auth-form-panel {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 4rem;
      background: var(--white-luxury);
    }

    .auth-card {
      width: 100%;
      max-width: 380px;
    }

    .auth-card-label {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--brown-light);
      margin-bottom: 0.5rem;
    }

    .auth-card-title {
      font-family: var(--font-serif);
      font-size: 2.4rem;
      font-weight: 400;
      color: var(--brown-dark);
      margin-bottom: 2.5rem;
    }

    .form-group {
      margin-bottom: 1.8rem;
    }

    .form-group label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--brown-dark);
      margin-bottom: 0.6rem;
    }

    /* Clean typography input style with subtle bottom indicator line */
    .form-group input {
      width: 100%;
      padding: 1rem 0;
      border: none;
      border-bottom: 1px solid var(--brown-light);
      background: transparent;
      font-family: var(--font-sans);
      font-size: 1rem;
      color: var(--brown-dark);
      transition: border-color 0.3s ease;
      border-radius: 0;
      outline: none;
    }

    .form-group input:focus {
      border-bottom-color: var(--brown-dark);
    }

    .form-group input::placeholder {
      color: #CBC4BB;
    }

    /* Sophisticated blocks signature button layout */
    .btn-primary {
      width: 100%;
      padding: 1.2rem;
      background: var(--brown-dark);
      color: var(--white-luxury);
      border: none;
      font-family: var(--font-sans);
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background-color 0.3s ease;
      margin-top: 1rem;
    }

    .btn-primary:hover {
      background: var(--brown-warm);
    }

    .auth-switch {
      text-align: center;
      margin-top: 2rem;
      font-size: 0.9rem;
      color: var(--brown-light);
    }

    .auth-switch a {
      color: var(--brown-warm);
      text-decoration: none;
      font-weight: 500;
    }

    .auth-switch a:hover {
      text-decoration: underline;
    }

    .admin-link {
      text-align: center;
      margin-top: 3.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border-soft);
    }

    .admin-link a {
      color: var(--brown-light);
      text-decoration: none;
      font-size: 0.8rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      transition: color 0.2s ease;
    }

    .admin-link a:hover {
      color: var(--brown-dark);
    }

    /* Responsive adjustments for phone and tablets */
    @media (max-width: 768px) {
      .auth-wrapper {
        grid-template-columns: 1fr;
      }
      .auth-hero {
        padding: 4rem 2rem;
        min-height: auto;
      }
      .auth-hero::after {
        inset: 12px;
      }
      .hero-footer-signature {
        margin-top: 2rem;
      }
      .auth-form-panel {
        padding: 4rem 2rem;
      }
    }
  </style>
</head>
<body>

<div class="auth-wrapper">
  <div class="auth-hero">
    <div></div>
    
    <div class="auth-hero-content">
      <h1 class="hero-title">Briella's<br><em>Cookies</em></h1>
      <p class="hero-tagline">Handcrafted with love</p>
      <div class="hero-divider"></div>
      <p class="hero-quote">"Every cookie is baked with care, warmth, and a little magic."</p>
    </div>
    
    <div class="hero-footer-signature">
      <span>0906 512 5377</span>
      <span class="dot">•</span>
      <span>Lara Cinco</span>
    </div>
  </div>

  <div class="auth-form-panel">
    <div class="auth-card">
      <p class="auth-card-label">Welcome back</p>
      <h2 class="auth-card-title">Sign In</h2>

      <form onsubmit="event.preventDefault();">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="you@email.com" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-primary">Sign In</button>
      </form>

      <p class="auth-switch">Don't have an account? <a href="#">Create one</a></p>

      <div class="admin-link">
        <a href="#">Admin Portal</a>
      </div>
    </div>
  </div>
</div>

</body>
</html>
