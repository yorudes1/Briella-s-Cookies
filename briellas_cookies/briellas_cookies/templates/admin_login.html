{% extends 'base.html' %}
{% block title %}Admin Login — Briella's Cookies{% endblock %}

{% block extra_styles %}
<style>
  body { background: var(--brown-dark); min-height: 100vh; display: flex; flex-direction: column; }
  .admin-login-wrap {
    flex: 1; display: flex; align-items: center; justify-content: center;
    padding: 60px 24px; position: relative; overflow: hidden;
  }
  .admin-login-wrap::before {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(ellipse at 50% 40%, rgba(155,94,60,0.2) 0%, transparent 65%);
  }
  .bg-pattern { position: absolute; inset: 0; background-image: radial-gradient(circle, rgba(200,149,106,0.05) 1px, transparent 1px); background-size: 30px 30px; }

  .admin-card {
    position: relative; background: rgba(253,250,245,0.04); border: 1px solid rgba(200,149,106,0.2);
    border-radius: 8px; padding: 52px 48px; width: 100%; max-width: 420px; backdrop-filter: blur(10px);
  }
  .admin-icon { font-size: 2.5rem; text-align: center; margin-bottom: 16px; }
  .admin-card-label { text-align: center; font-size: 0.68rem; font-weight: 600; letter-spacing: 0.25em; text-transform: uppercase; color: var(--gold-light); margin-bottom: 6px; }
  .admin-card-title { text-align: center; font-family: 'Playfair Display', serif; font-size: 1.85rem; color: var(--brown-cream); margin-bottom: 36px; letter-spacing: 0.02em; }

  .form-group { margin-bottom: 24px; }
  .form-group label { display: block; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--brown-light); margin-bottom: 8px; }
  .form-group input {
    width: 100%; padding: 12px 16px; background: rgba(59,31,14,0.4); border: 1px solid rgba(200,149,106,0.25);
    border-radius: 4px; font-family: 'Jost', sans-serif; font-size: 0.95rem; color: var(--white); outline: none; transition: all 0.25s;
  }
  .form-group input:focus { border-color: var(--gold-light); background: rgba(59,31,14,0.6); box-shadow: 0 0 0 3px rgba(212,168,67,0.15); }

  .btn-admin {
    width: 100%; padding: 14px; background: var(--brown-warm); color: var(--white); border: none; border-radius: 4px;
    font-family: 'Jost', sans-serif; font-size: 0.8rem; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase;
    cursor: pointer; transition: all 0.25s; margin-top: 8px;
  }
  .btn-admin:hover { background: var(--brown-light); box-shadow: 0 6px 24px rgba(0,0,0,0.3); transform: translateY(-1px); }

  .back-link { text-align: center; margin-top: 32px; padding-top: 20px; border-top: 1px solid rgba(200,149,106,0.1); }
  .back-link a { font-size: 0.78rem; color: var(--brown-light); text-decoration: none; letter-spacing: 0.08em; transition: color 0.2s; }
  .back-link a:hover { color: var(--brown-cream); text-decoration: underline; }
</style>
{% endblock %}

{% block content %}
<div class="admin-login-wrap">
  <div class="bg-pattern"></div>
  <div class="admin-card">
    <div class="admin-icon">🔐</div>
    <p class="admin-card-label">Restricted Access</p>
    <h2 class="admin-card-title">ADMIN</h2>

    <form method="POST" action="{{ url_for('admin_login') }}">
      <div class="form-group">
        <label>Username</label>
        <input type="text" name="username" placeholder="Username" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn-admin">Authenticate</button>
    </form>

    <div class="back-link">
      <a href="{{ url_for('login') }}">← Back to Customer Storefront</a>
    </div>
  </div>
</div>
{% endblock %}
