{% extends 'base.html' %}
{% block title %}Admin Login — Briella's Cookies{% endblock %}

{% block extra_styles %}
<style>
  body { background: var(--brown-dark); min-height: 100vh; display: flex; flex-direction: column; }
  .admin-login-wrap {
    flex: 1; display: flex; align-items: center; justify-content: center;
    padding: 60px 24px;
    position: relative; overflow: hidden;
  }
  .admin-login-wrap::before {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at 50% 40%, rgba(155,94,60,0.2) 0%, transparent 65%);
  }
  .bg-pattern {
    position: absolute; inset: 0;
    background-image: radial-gradient(circle, rgba(200,149,106,0.05) 1px, transparent 1px);
    background-size: 30px 30px;
  }

  .admin-card {
    position: relative;
    background: rgba(253,250,245,0.04);
    border: 1px solid rgba(200,149,106,0.2);
    border-radius: 8px;
    padding: 52px 48px;
    width: 100%; max-width: 420px;
    backdrop-filter: blur(10px);
  }

  .admin-icon {
    width: 56px; height: 56px;
    background: var(--brown-mid);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.5rem;
    margin: 0 auto 24px;
    border: 1px solid rgba(200,149,106,0.3);
  }

  .admin-card-label { font-size: 0.72rem; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold-light); text-align: center; margin-bottom: 8px; }
  .admin-card-title { font-family: 'Playfair Display', serif; font-size: 1.9rem; color: var(--brown-cream); text-align: center; margin-bottom: 36px; }

  .form-group { margin-bottom: 20px; }
  .form-group label { display: block; font-size: 0.76rem; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: var(--brown-light); margin-bottom: 8px; }
  .form-group input {
    width: 100%; padding: 13px 16px;
    background: rgba(253,250,245,0.06);
    border: 1px solid rgba(200,149,106,0.25);
    border-radius: 3px;
    font-family: 'Jost', sans-serif; font-size: 0.92rem;
    color: var(--brown-cream); outline: none;
    transition: border-color 0.2s, background 0.2s;
  }
  .form-group input:focus { border-color: var(--gold-light); background: rgba(253,250,245,0.1); }
  .form-group input::placeholder { color: rgba(200,149,106,0.4); }

  .btn-admin {
    width: 100%; padding: 15px;
    background: var(--brown-warm); color: var(--white);
    border: none; border-radius: 3px;
    font-family: 'Jost', sans-serif; font-size: 0.82rem; font-weight: 600;
    letter-spacing: 0.18em; text-transform: uppercase;
    cursor: pointer; transition: all 0.25s; margin-top: 8px;
  }
  .btn-admin:hover { background: var(--brown-light); box-shadow: 0 6px 24px rgba(0,0,0,0.3); transform: translateY(-1px); }

  .back-link { text-align: center; margin-top: 28px; }
  .back-link a { font-size: 0.78rem; color: rgba(200,149,106,0.5); text-decoration: none; letter-spacing: 0.08em; transition: color 0.2s; }
  .back-link a:hover { color: var(--brown-light); }

  footer { background: transparent !important; border-top: 1px solid rgba(200,149,106,0.1); }
  footer * { color: rgba(200,149,106,0.4) !important; }
  .footer-brand { color: rgba(200,149,106,0.5) !important; }
</style>
{% endblock %}

{% block content %}
<div class="admin-login-wrap">
  <div class="bg-pattern"></div>
  <div class="admin-card">
    <div class="admin-icon">🔐</div>
    <p class="admin-card-label">Restricted Access</p>
    <h2 class="admin-card-title">Admin Portal</h2>

    <form method="POST">
      <div class="form-group">
        <label>Username</label>
        <input type="text" name="username" placeholder="Admin username" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn-admin">Access Dashboard</button>
    </form>

    <div class="back-link">
      <a href="{{ url_for('login') }}">← Back to Customer Login</a>
    </div>
  </div>
</div>
{% endblock %}
